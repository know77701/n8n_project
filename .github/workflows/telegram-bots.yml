name: telegram-bots
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dc
            script: dc_view.py
            config: new_config.json
            seen: new_seen.json
            token_secret: TG_TOKEN_DC_2
          - name: dc_v2
            script: test.py
            config: config.json
            seen: seen.json
            token_secret: TG_TOKEN_DC
          - name: dc_v3
            script: dc_view_v2.py
            config: new_config.json
            seen: new_seen.json
            token_secret: TG_TOKEN_DC_2
    concurrency:
      group: bots-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 pillow curl_cffi imageio-ffmpeg
      - name: 빈 config 생성
        run: echo '{}' > ${{ matrix.config }}
      - name: 실행
        timeout-minutes: 20
        env:
          TELEGRAM_TOKEN: ${{ secrets[matrix.token_secret] }}
          CONFIG_PATH: ${{ matrix.config }}
          STATE_PATH: ${{ matrix.seen }}
          MAX_RUN_MINUTES: "15"
        run: python ${{ matrix.script }} --once
      - name: 본 글 기록 커밋
        if: ${{ !cancelled() }}
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add ${{ matrix.seen }}
          git commit -m "state ${{ matrix.name }}" || exit 0
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 3
          done
          exit 1
